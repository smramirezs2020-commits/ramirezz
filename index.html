<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mi bonita</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background: #ffd6e8;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* 💗 Fondo de corazones que suben */
    .heart {
        position: absolute;
        width: 20px;
        height: 20px;
        background: pink;
        opacity: 0.6;
        transform: rotate(45deg);
        animation: float 6s infinite ease-in;
        border-radius: 5px;
    }

    .heart::before,
    .heart::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        background: pink;
        border-radius: 50%;
    }

    .heart::before { top: -10px; left: 0; }
    .heart::after { left: -10px; top: 0; }

    @keyframes float {
        0% {
            transform: translateY(100vh) rotate(45deg);
            opacity: 1;
        }
        100% {
            transform: translateY(-20vh) rotate(45deg);
            opacity: 0;
        }
    }

    h2 {
        font-size: 28px;
        color: #ff3b8d;
        margin-bottom: 20px;
    }

    .contenedor {
        text-align: center;
        z-index: 10;
    }

    .candado {
        width: 260px;
        margin: auto;
        background: #ff77b7;
        padding: 40px 20px;
        border-radius: 30px;
        box-shadow: 0 0 20px rgba(255, 0, 120, 0.3);
    }

    .input-group {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 20px;
    }

    .selector {
        background: #fff;
        padding: 10px;
        border-radius: 15px;
        width: 70px;
        box-shadow: 0 0 15px rgba(255, 0, 120, 0.3);
    }

    .selector button {
        width: 100%;
        background: none;
        border: none;
        font-size: 22px;
        color: #ff3b8d;
        cursor: pointer;
    }

    .selector div {
        font-size: 22px;
        font-weight: bold;
        color: #ff3b8d;
        padding: 5px 0;
    }

    #mensaje {
        margin-top: 20px;
        font-size: 20px;
        color: #ff3b8d;
        font-weight: bold;
        display: none;
    }

    .correcto {
        animation: pop 0.4s ease;
        color: #ff006a !important;
    }

    @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }
</style>
</head>

<body>

<!-- ❤️ Corazones animados generados automáticamente -->
<script>
    for (let i = 0; i < 25; i++) {
        let h = document.createElement("div");
        h.className = "heart";
        h.style.left = Math.random() * 100 + "vw";
        h.style.animationDuration = (4 + Math.random() * 4) + "s";
        h.style.opacity = Math.random();
        document.body.appendChild(h);
    }
</script>

<div class="contenedor">

    <h2>Ingresa la fecha correcta…</h2>

    <div class="candado">
        <div class="input-group">

            <div class="selector">
                <button onclick="cambiar(0, -1)">▲</button>
                <div id="v0">01</div>
                <button onclick="cambiar(0, 1)">▼</button>
            </div>

            <div class="selector">
                <button onclick="cambiar(1, -1)">▲</button>
                <div id="v1">01</div>
                <button onclick="cambiar(1, 1)">▼</button>
            </div>

            <div class="selector">
                <button onclick="cambiar(2, -1)">▲</button>
                <div id="v2">23</div>
                <button onclick="cambiar(2, 1)">▼</button>
            </div>

        </div>
    </div>

    <p style="margin-top: 25px; font-size: 16px;">
        Pista: La fecha en que tuvimos nuestra primera charla ❤️
    </p>

    <div id="mensaje"></div>

</div>

<script>
    let valores = [1, 1, 23];
    const correcto = [12, 11, 25]; // ← CAMBIA AQUÍ

    function actualizar() {
        for (let i = 0; i < 3; i++) {
            document.getElementById("v" + i).innerText =
                valores[i].toString().padStart(2, "0");
        }
        validar();
    }

    function cambiar(pos, dir) {
        if (pos === 2) {
            valores[pos] = valores[pos] + dir;
            if (valores[pos] > 31) valores[pos] = 1;
            if (valores[pos] < 1) valores[pos] = 31;
        } else {
            valores[pos] = valores[pos] + dir;
            if (valores[pos] > 12) valores[pos] = 1;
            if (valores[pos] < 1) valores[pos] = 12;
        }
        actualizar();
    }

    function validar() {
        if (JSON.stringify(valores) === JSON.stringify(correcto)) {
            document.getElementById("mensaje").innerText = "¡Correcto! ❤️🔓";
            document.getElementById("mensaje").style.display = "block";

            setTimeout(() => {
                window.location.href = "carta.html"; 
            }, 1000);
        } else {
            document.getElementById("mensaje").style.display = "none";
        }
    }

    actualizar();
</script>

</body>
</html>
