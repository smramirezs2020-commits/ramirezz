<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti ❤️</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: #ffd6e8;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    /* ❤️ corazones flotando */
    .heart {
        position: absolute;
        color: #ff4d88;
        font-size: 20px;
        animation: float 6s linear infinite;
        opacity: 0.7;
    }

    @keyframes float {
        0% { transform: translateY(100vh) scale(1); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateY(-10vh) scale(1.4); opacity: 0; }
    }

    .card {
        background: white;
        padding: 25px 35px;
        width: 90%;
        max-width: 720px;
        text-align: center;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 10;
        position: relative;
        animation: fadein 1.6s ease;
    }

    @keyframes fadein {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        color: #ff4d88;
        font-size: 30px;
        margin-bottom: 10px;
    }

    #texto {
        font-size: 19px;
        line-height: 1.6;
        opacity: 0;
        min-height: 160px;
        white-space: pre-line;
        transition: opacity 0.3s ease;
    }

    #btnContinuar {
        display: none;
        margin-top: 8px;
        padding: 12px 25px;
        font-size: 18px;
        background-color: #ff4d88;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s ease;
    }

    #btnContinuar:hover {
        transform: scale(1.06);
    }
</style>
</head>

<body>

<!-- ❤️ contenedor de corazones -->
<div id="hearts-container"></div>

<div class="card">
    <h1>Para ti mi bonita ❤️</h1>
    <p id="texto"></p>
    <button id="btnContinuar" onclick="location.href='musica.html'">Continuar 💕</button>
</div>

<script>
    /* ✨ Texto que se escribe solo */
    const mensaje = `Desde que llegaste a mi vida, todo se siente un poquito más bonito.  
Cada día contigo es un regalo, cada risa que me causas al hablar contigo,
cada detalle, cada sonrisa que aparece en mi rostro incluso cuando
no estamos conversando, esas charlas nocturnas tan bonitas...
Es extraño y a la vez tan bonito, cómo alguien que conocí hace tan poco
puede hacerme sentir tanto, me sorprende la calma que me das,
la confianza que nace sin forzar nada, lo ligeros que se volvieron mis días
desde que apareciste.
Me gusta como me escuchas, como me hablas, cómo haces que 
hasta las cosas más simples se sientan especiales.
Se siente muy bonito cuando me llega una notificación y eres tú. 
Ojalá pudieras ver lo que provocas, como de la nada me encuentro
pensando en ti con una sonrisa tonta, como haces que todo se sienta
un poquito más mágico.
Gracias por existir y gracias por llegar justo
cuando no sabía que necesitaba a alguien como tú ✨
Te Quiero mi bonita ❤️`;

    let index = 0;
    const texto = document.getElementById("texto");
    const boton = document.getElementById("btnContinuar");

    function escribir() {
        if (index < mensaje.length) {
            texto.style.opacity = 1;
            texto.innerHTML += mensaje.charAt(index);
            index++;
            setTimeout(escribir, 40);
        } else {
            boton.style.display = "inline-block";
        }
    }

    escribir();

    /* ❤️ Generación automática de corazones flotando */
    const cont = document.getElementById("hearts-container");

    function crearCorazon() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (20 + Math.random() * 20) + "px";
        heart.style.animationDuration = (4 + Math.random() * 4) + "s";

        cont.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }

    setInterval(crearCorazon, 400);
</script>

</body>
</html>
