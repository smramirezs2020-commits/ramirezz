<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💕</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: #ffd6e8;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    /* ❤️ corazones flotando */
    .heart {
        position: absolute;
        color: #ff4d88;
        font-size: 20px;
        animation: float 6s linear infinite;
        opacity: 0.7;
        pointer-events: none;
    }

    @keyframes float {
        0% { transform: translateY(100vh) scale(1); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateY(-10vh) scale(1.4); opacity: 0; }
    }

    .container {
        background: white;
        padding: 40px 50px;
        width: 90%;
        max-width: 650px;
        text-align: center;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 10;
        position: relative;
        animation: fadein 1.3s ease;
    }

    @keyframes fadein {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        color: #ff4d88;
        font-size: 32px;
        margin-bottom: 10px;
    }

    p {
        font-size: 18px;
        margin-bottom: 20px;
    }

    /* player */
    iframe {
        border-radius: 15px;
        width: 100%;
        height: 152px;
        border: none;
        margin-top: 10px;
        animation: fadein 1.5s ease;
    }
</style>
</head>

<body>

<!-- ❤️ contenedor de corazones -->
<div id="hearts-container"></div>

<div class="container">
    <h1>Te la dedico.. 💗</h1>

    <p>
        Cada palabra de esta canción me recuerda a ti…  
        Gracias por hacer mi vida más bonita ❤️
    </p>

    <!-- Player: Humbe - Por Favor -->
    <iframe 
  src="https://www.youtube.com/embed/yHIBiRzxWY8" 
  width="100%" 
  height="300" 
  style="border-radius: 15px; margin-top: 10px;" 
  frameborder="0" 
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
  allowfullscreen>
</iframe>


<script>
    /* ❤️ Generación automática de corazones flotando */
    const cont = document.getElementById("hearts-container");

    function crearCorazon() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (20 + Math.random() * 20) + "px";
        heart.style.animationDuration = (4 + Math.random() * 4) + "s";

        cont.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }

    setInterval(crearCorazon, 400);
</script>

</body>
</html>
